name: gateway-conformance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests conformance
      - run: python -m ruff check src tests conformance
      - run: python -m pytest
      - name: Coverage gate
        run: |
          python -m pytest --cov=valo_gateway --cov-report=term --cov-fail-under=90
