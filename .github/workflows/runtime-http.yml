name: Runtime HTTP

on:
  pull_request:
    paths:
      - "src/valo_gateway/runtime_http_service.py"
      - "src/valo_gateway/capability_frontdoor.py"
      - "tests/test_runtime_http_service.py"
      - ".github/workflows/runtime-http.yml"
  push:
    branches:
      - "feat/http-runtime-gateway"
    paths:
      - "src/valo_gateway/runtime_http_service.py"
      - "tests/test_runtime_http_service.py"
      - ".github/workflows/runtime-http.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_runtime_http_service.py tests/test_capability_frontdoor.py -q
